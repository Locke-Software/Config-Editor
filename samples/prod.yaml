api:
  url: https://api.example.com
  timeoutMs: 5000
  retryCount: 3
database:
  port: 5432
  host: prod-db.internal
  name: app_prod
  pool:
    max: 50
featureFlags:
  newUi: false
  betaSearch: false
logging:
  level: warn
  format: json
cache:
  enabled: true
cdn:
  url: https://cdn.example.com
server:
  host: 0.0.0.0
  port: 8080
  workers: 8
  requestTimeoutMs: 15000
  loca:
    - name: test
      otjername: tester
      deazdq: dzqdee
    - name: test2d
      otjername: tester
      deazdq: dzqdee
security:
  corsAllowedOrigins: https://app.example.com
  jwtExpiryMinutes: 30
  passwordMinLength: 10
  mfaEnabled: true
smtp:
  host: smtp.example.com
  port: 587
  username: prod-mailer
  useTls: true
storage:
  provider: s3
  bucket: prod-uploads
  region: us-west-2
redis:
  port: 6379
  host: prod-redis.internal
  ttlSeconds: 600
monitoring:
  metricsEnabled: true
  tracingSampleRate: 0.01
  alertWebhookUrl: https://hooks.example.com/alerts
queue:
  workerConcurrency: 8
  maxRetries: 5
  visibilityTimeoutSeconds: 60
pagination:
  defaultPageSize: 20
  maxPageSize: 100
i18n:
  - en-US
  - fr-FR
  - es-ESe
  - de-DEd
test: "{thing: value,otherthing: othervalue}"
defaultLocale: en-US
supportedLocales: ""
throttling:
  requestsPerMinute: 3000
  burst: 200
search:
  provider: opensearch
  indexName: prod_index
  timeoutMs: 1500
analytics:
  enabled: true
  writeKey: prod-write-key
